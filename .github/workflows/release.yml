# Builds Myrling.app on a Mac runner and attaches it to a GitHub Release.
#
# Triggered by pushing a tag like v1.1, which `make release VERSION=1.1` makes
# for you. Nothing here needs the update signing key: that key signs the editor
# page, which is published from the maintainer's machine by `make site`, and it
# must never be copied into CI.
#
# ---------------------------------------------------------------------------
# Signing and notarisation (optional — the build works without any of it)
# ---------------------------------------------------------------------------
# Without the secrets below the app is ad-hoc signed, exactly as a local `make
# app` builds it. It runs fine, but macOS has no way to tell who made it, so the
# first launch has to be allowed by hand (System Settings -> Privacy & Security
# -> Open Anyway). The release notes say so.
#
# With an Apple Developer Program membership ($99/year), add these five
# repository secrets (Settings -> Secrets and variables -> Actions -> New
# repository secret) and every release after that is signed, notarised and
# stapled, and opens with a double-click like any other app:
#
#   MACOS_CERT_P12
#     Base64 of a "Developer ID Application" certificate exported as .p12.
#     In Xcode: Settings -> Accounts -> your Apple ID -> Manage Certificates ->
#     + -> Developer ID Application. Then in Keychain Access, find it under
#     "My Certificates", right-click -> Export, save as certificate.p12 with a
#     password. Turn it into one line with:
#         base64 -i certificate.p12 | pbcopy
#     and paste that as the secret's value.
#
#   MACOS_CERT_PASSWORD
#     The password you typed when exporting that .p12.
#
#   APPLE_API_KEY
#     An App Store Connect API key (.p8), base64 encoded:
#         base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy
#     Make one at appstoreconnect.apple.com -> Users and Access ->
#     Integrations -> Keys, with the Developer role. It downloads once.
#     An API key is used here rather than an Apple ID and app-specific
#     password on purpose: there is no account to lock out and no two-factor
#     prompt, which is what an unattended build needs.
#
#   APPLE_API_KEY_ID
#     The Key ID beside the key on that page; also the XXXXXXXXXX in the
#     downloaded file's name.
#
#   APPLE_API_ISSUER
#     The Issuer ID shown above the key table on the same page. A UUID.
#
# All five have to be present for the signed path to run. With none of them the
# workflow falls back to ad-hoc and still publishes a release; with only some of
# them it stops, because that is a secret gone missing, and quietly shipping an
# unsigned build in place of a notarised one would be worse than shipping nothing.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # the release, and the announcement pushed to main after it
  pages: write      # asking Pages to rebuild so the announcement goes live

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          # the whole history, so we can list the commits since the last tag
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NUMBER="${TAG#v}"
          # the app says its own version from mac/Info.plist, so a tag that disagrees
          # would publish a download under one number that calls itself another
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' mac/Info.plist)"
          if [ "$NUMBER" != "$PLIST" ]; then
            echo "The tag $TAG does not match mac/Info.plist, which says $PLIST." >&2
            echo 'Cut releases with make release VERSION=..., which keeps the two together.' >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      # The secrets context cannot be used in an `if:`, so the later steps test
      # this step's output instead.
      - name: Is this a signed build?
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          SET=0
          for v in "$MACOS_CERT_P12" "$MACOS_CERT_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; do
            if [ -n "$v" ]; then SET=$((SET + 1)); fi
          done
          if [ "$SET" -eq 5 ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Developer ID secrets are present: signing and notarising.'
          elif [ "$SET" -eq 0 ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No Developer ID secrets: ad-hoc signing. See the comments in this file.'
          else
            echo "Only $SET of the 5 signing secrets are set. Set all five, or remove them all" >&2
            echo 'for an ad-hoc build; see the comments at the top of this file.' >&2
            exit 1
          fi

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.available == 'true'
        id: keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/myrling-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/certificate.p12"

          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERT_PASSWORD" -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT"

          # `|| true` so an empty result falls through to the message below
          # rather than to pipefail's bare exit code
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}' || true)"
          if [ -z "$IDENTITY" ]; then
            echo 'No "Developer ID Application" identity in that .p12.' >&2
            echo 'Export the Developer ID Application certificate, not a Development one.' >&2
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build Myrling.app
        run: make app

      - name: Sign with Developer ID
        if: steps.signing.outputs.available == 'true'
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" dist/Myrling.app
          codesign --verify --strict --verbose=2 dist/Myrling.app

      - name: Zip the app
        env:
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          # ditto, not zip: it keeps the bundle's symlinks, permissions and
          # extended attributes, which a plain zip quietly drops.
          ditto -c -k --keepParent dist/Myrling.app "dist/Myrling-$NUMBER.zip"

      - name: Notarise and staple
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ZIP: dist/Myrling-${{ steps.version.outputs.number }}.zip
        run: |
          set -euo pipefail
          # An App Store Connect API key, not an Apple ID and app-specific password:
          # it carries no account to lock out and no two-factor prompt to trip over,
          # which is what CI wants. The key arrives base64 so it survives a secret.
          KEYFILE="$RUNNER_TEMP/asc-key.p8"
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT

          xcrun notarytool submit "$ZIP" \
            --key "$KEYFILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          # The ticket is stapled to the app, so the zip has to be made again
          # from the stapled bundle — that is what people download.
          xcrun stapler staple dist/Myrling.app
          xcrun stapler validate dist/Myrling.app
          rm -f "$ZIP"
          ditto -c -k --keepParent dist/Myrling.app "$ZIP"

      - name: Write the release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          PREVIOUS="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..$TAG"
            LIMIT=200
            echo "## What changed since $PREVIOUS" > notes.md
          else
            # the first release: the whole history would be a wall, so take the
            # most recent stretch of it
            RANGE="$TAG"
            LIMIT=30
            echo '## What is in this one' > notes.md
          fi
          echo '' >> notes.md
          git log --no-merges -n "$LIMIT" --pretty=format:'- %s' "$RANGE" >> notes.md || true
          echo '' >> notes.md
          echo '' >> notes.md

          echo '## Getting it' >> notes.md
          echo '' >> notes.md
          echo 'Download the zip below, unzip it, and drag Myrling into Applications.' >> notes.md
          MIN="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' mac/Info.plist)"
          echo "It runs on macOS $MIN or later, on Apple silicon and Intel alike." >> notes.md
          if [ "$SIGNED" != 'true' ]; then
            echo '' >> notes.md
            echo 'This build is not signed with an Apple Developer ID, so the first' >> notes.md
            echo 'time you open it macOS will say it cannot check it for malicious' >> notes.md
            echo 'software. Close that box, open **System Settings -> Privacy & Security**,' >> notes.md
            echo 'and press **Open Anyway** beside Myrling. (Before macOS 15 you can instead' >> notes.md
            echo 'right-click the app and choose Open.) macOS remembers, and every launch' >> notes.md
            echo 'after that is an ordinary double-click.' >> notes.md
          fi
          echo '' >> notes.md
          echo 'The editor page inside the app updates itself: it checks GitHub on' >> notes.md
          echo 'launch and takes any newer page whose signature checks out. This' >> notes.md
          echo 'download only needs replacing when the app itself changes.' >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/Myrling-$NUMBER.zip" \
            --title "Myrling $NUMBER" \
            --notes-file notes.md

      # Only now that the download exists do installed copies hear about it. Doing
      # this from `make release` would announce a version whose build might still
      # fail, and each installed copy mentions a given version only once. If this
      # step cannot push, the release still stands; the warning says what to run.
      - name: Announce the release
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.version.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          git checkout -q -B main origin/main
          python3 tools/publish.py --announce "$NUMBER"
          if git diff --quiet -- docs/update.json; then
            echo "docs/update.json already announces $NUMBER."
            exit 0
          fi
          git add docs/update.json
          git commit -q -m "Announce Myrling $NUMBER"
          pushed=
          for attempt in 1 2 3; do
            if git push -q origin main; then pushed=1; break; fi
            git pull -q --rebase origin main || { git rebase --abort || true; break; }
          done
          if [ -z "$pushed" ]; then
            echo "::warning::Could not push the announcement. Run 'python3 tools/publish.py --announce $NUMBER', then commit and push docs/update.json."
            exit 0
          fi
          # a push made with this job's token may not start a Pages build by itself
          gh api -X POST "repos/$REPO/pages/builds" >/dev/null \
            || echo "::warning::Pushed the announcement, but could not ask Pages to rebuild; the next push to main will publish it."

      - name: Put the keychain back
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -f "$RUNNER_TEMP/myrling-signing.keychain-db" ]; then
            security list-keychains -d user -s login.keychain-db || true
            security delete-keychain "$RUNNER_TEMP/myrling-signing.keychain-db" || true
          fi
